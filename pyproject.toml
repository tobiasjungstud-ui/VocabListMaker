[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vocablistmaker"
version = "1.0.0"
description = "Erzeugt aus einer Excel-Wortliste zwei geprüfte Vokabeltests als Word-Datei."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tobias Jung" }]
keywords = ["vocabulary", "english", "teaching", "docx", "cefr"]

dependencies = [
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "wordfreq>=3.1",
    "pydantic>=2.6",
    "anthropic>=1.0",
    "streamlit>=1.32",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
vocablistmaker = "vocablistmaker.cli:main"

[project.urls]
Repository = "https://github.com/tobiasjungstud-ui/VocabListMaker"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vocablistmaker = ["data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]
